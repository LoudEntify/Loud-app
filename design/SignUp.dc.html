    </div>

    <p style="margin: 0; font-size: 14px; line-height: 1.35; color: rgba(1, 22, 39, 0.8)">By continuing you confirm you are 18 or over and agree to the <a href="#" style="font-weight: 700; text-decoration: underline">Terms and Conditions</a> and <a href="#" style="font-weight: 700; text-decoration: underline">Community Guidelines</a>.</p>
