<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'PT Sans Narrow','Arial Narrow',sans-serif;background:#f6f9f6}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
input::placeholder{color:#4e5a64;opacity:1}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 1010px; position: relative; overflow: hidden; background: radial-gradient(110% 55% at 100% 0%, rgba(46, 196, 182, 0.26), rgba(46, 196, 182, 0) 62%), radial-gradient(90% 45% at 0% 40%, rgba(255, 159, 28, 0.16), rgba(255, 159, 28, 0) 60%), radial-gradient(100% 50% at 70% 100%, rgba(46, 196, 182, 0.16), rgba(46, 196, 182, 0) 60%), linear-gradient(118deg, rgba(255, 255, 255, 0) 28%, rgba(255, 255, 255, 0.7) 44%, rgba(255, 255, 255, 0) 60%), #f6f9f6; color: #011627; font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif">
  <div style="box-sizing: border-box; padding: 52px 16px 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Settings.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: rgba(1, 22, 39, 0.07); display: flex; align-items: center; justify-content: center"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 30px">Audio</h1>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Settings for</span>
      <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 2px solid #011627; background: #fdfffc; color: #011627; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>[Saved place]</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: rgba(1, 22, 39, 0.07); color: #011627; font-size: 16px; display: flex; align-items: center; gap: 4px"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New place</button>
    </div>

    <section role="radiogroup" aria-labelledby="mic-h" style="padding: 14px; border-radius: 18px; background: rgba(255, 255, 255, 0.72); display: flex; flex-direction: column; gap: 8px">
      <h2 id="mic-h" style="margin: 0; font-size: 20px">Microphone</h2>
      <button role="radio" aria-checked="true" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #011627; background: #fdfffc; color: #011627; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; text-align: left"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg><span style="flex: 1">[USB audio interface]</span><span style="width: 24px; height: 24px; border-radius: 12px; background: #011627; color: #fdfffc; display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></button>
      <button role="radio" aria-checked="false" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: none; background: rgba(1, 22, 39, 0.07); color: #011627; font-size: 17px; display: flex; align-items: center; gap: 10px; text-align: left"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg><span style="flex: 1">[Phone microphone]</span></button>
      <button role="radio" aria-checked="false" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: none; background: rgba(1, 22, 39, 0.07); color: #011627; font-size: 17px; display: flex; align-items: center; gap: 10px; text-align: left"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17v-4a8 8 0 0 1 16 0v4"></path><rect x="3" y="15" width="4" height="6" rx="1.5"></rect><rect x="17" y="15" width="4" height="6" rx="1.5"></rect></svg><span style="flex: 1">[Headset microphone]</span></button>
      <span role="status" style="display: flex; align-items: center; gap: 8px; padding: 4px 2px 0; font-size: 16px"><span style="width: 22px; height: 22px; border-radius: 11px; background: linear-gradient(135deg, #2ec4b6 0%, #8fe6dd 48%, #2ec4b6 100%); display: flex; align-items: center; justify-content: center"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Mic health: real signal detected</span>
    </section>

    <section style="padding: 14px; border-radius: 18px; background: rgba(255, 255, 255, 0.72); display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 20px">Vocal preset</h2>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 16px; font-weight: 700">Clean-up<input type="range" min="0" max="10" style="width: 100%; accent-color: #011627"></label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 16px; font-weight: 700">Compression<input type="range" min="0" max="10" style="width: 100%; accent-color: #011627"></label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 16px; font-weight: 700">Space (reverb)<input type="range" min="0" max="10" style="width: 100%; accent-color: #011627"></label>
    </section>

    <section style="padding: 14px; border-radius: 18px; background: rgba(255, 255, 255, 0.72); display: flex; flex-direction: column; gap: 6px">
      <label for="balance" style="font-size: 20px; font-weight: 700">Backing track balance</label>
      <input id="balance" type="range" min="0" max="10" style="width: 100%; accent-color: #011627">
      <div style="display: flex; justify-content: space-between; font-size: 15px; color: rgba(1, 22, 39, 0.75)"><span>More track</span><span>More voice</span></div>
    </section>

    <section style="padding: 14px; border-radius: 18px; background: rgba(255, 255, 255, 0.72); display: flex; align-items: center; gap: 12px">
      <svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17v-4a8 8 0 0 1 16 0v4"></path><rect x="3" y="15" width="4" height="6" rx="1.5"></rect><rect x="17" y="15" width="4" height="6" rx="1.5"></rect></svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 18px">Headphone delay check</h2><span style="font-size: 15px; line-height: 1.3; color: rgba(1, 22, 39, 0.75)">For Bluetooth earphones. Wired is best for singing.</span></div>
      <button style="height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 20px; border: none; background: rgba(1, 22, 39, 0.07); color: #011627; font-size: 16px; font-weight: 700">Run check</button>
    </section>

    <button style="height: 52px; border-radius: 26px; border: none; background: linear-gradient(135deg, #2ec4b6 0%, #8fe6dd 48%, #2ec4b6 100%); color: #011627; font-size: 18px; font-weight: 700">Save to [Saved place]</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1010}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
