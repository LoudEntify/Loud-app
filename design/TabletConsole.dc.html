<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet: live console</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'PT Sans Narrow','Arial Narrow',sans-serif;background:#011627}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
input::placeholder{color:#c9cfd1;opacity:1}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 1024px; height: 768px; position: relative; overflow: hidden; background: radial-gradient(80% 45% at 88% 8%, rgba(46, 196, 182, 0.38), rgba(46, 196, 182, 0) 65%), radial-gradient(75% 45% at 8% 52%, rgba(231, 29, 54, 0.26), rgba(231, 29, 54, 0) 65%), radial-gradient(95% 55% at 55% 100%, rgba(255, 159, 28, 0.24), rgba(255, 159, 28, 0) 62%), linear-gradient(125deg, rgba(253, 255, 252, 0) 30%, rgba(253, 255, 252, 0.07) 46%, rgba(253, 255, 252, 0) 58%), #011627; color: #fdfffc; font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif">
  <div style="box-sizing: border-box; height: 100%; padding: 40px 20px 20px; display: flex; gap: 16px">
    <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="padding: 5px 12px; border-radius: 999px; background: #e71d36; color: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 0.1em">LIVE</span>
        <span style="font-size: 18px; font-weight: 700">[mm:ss]</span>
        <span style="display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(253, 255, 252, 0.12); font-size: 15px"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>[n]</span>
        <span style="flex: 1"></span>
        <button style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: rgba(253, 255, 252, 0.14); color: #fdfffc; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L15 9"></path><path d="M16 3l1.2 2.8L20 7l-2.8 1.2L16 11l-1.2-2.8L12 7l2.8-1.2z"></path></svg>Director: Auto</button>
      </div>

      <div style="position: relative; flex: 1; border-radius: 18px; background: radial-gradient(90% 60% at 80% 10%, rgba(46, 196, 182, 0.45), rgba(46, 196, 182, 0) 65%), radial-gradient(90% 60% at 10% 90%, rgba(231, 29, 54, 0.32), rgba(231, 29, 54, 0) 65%), #0a2a40; display: flex; align-items: center; justify-content: center">
        <span style="font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(253, 255, 252, 0.7)">[What viewers see now]</span>
        <span style="position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(1, 22, 39, 0.7); font-size: 14px; font-weight: 700">ON AIR · MAIN</span>
      </div>

      <div style="display: flex; gap: 10px">
        <button aria-pressed="true" style="position: relative; flex: 1; height: 96px; border-radius: 12px; border: 3px solid #2ec4b6; box-sizing: border-box; background: radial-gradient(90% 60% at 80% 10%, rgba(46, 196, 182, 0.45), rgba(46, 196, 182, 0) 65%), radial-gradient(90% 60% at 10% 90%, rgba(231, 29, 54, 0.32), rgba(231, 29, 54, 0) 65%), #0a2a40; color: #fdfffc; padding: 0"><span style="position: absolute; left: 8px; bottom: 6px; font-size: 14px; font-weight: 700">Main</span></button>
        <button aria-pressed="false" style="position: relative; flex: 1; height: 96px; border-radius: 12px; border: 2px solid rgba(253, 255, 252, 0.3); box-sizing: border-box; background: radial-gradient(90% 60% at 80% 10%, rgba(46, 196, 182, 0.45), rgba(46, 196, 182, 0) 65%), radial-gradient(90% 60% at 10% 90%, rgba(231, 29, 54, 0.32), rgba(231, 29, 54, 0) 65%), #0a2a40; color: #fdfffc; padding: 0"><span style="position: absolute; left: 8px; bottom: 6px; font-size: 14px; font-weight: 700">Side</span></button>
        <button aria-pressed="false" style="position: relative; flex: 1; height: 96px; border-radius: 12px; border: 2px solid rgba(253, 255, 252, 0.3); box-sizing: border-box; background: radial-gradient(90% 60% at 80% 10%, rgba(46, 196, 182, 0.45), rgba(46, 196, 182, 0) 65%), radial-gradient(90% 60% at 10% 90%, rgba(231, 29, 54, 0.32), rgba(231, 29, 54, 0) 65%), #0a2a40; color: #fdfffc; padding: 0"><span style="position: absolute; left: 8px; bottom: 6px; font-size: 14px; font-weight: 700">Close</span></button>
        <div style="flex: 1; height: 96px; border-radius: 12px; border: 2px dashed rgba(253, 255, 252, 0.3); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; color: rgba(253, 255, 252, 0.8)"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18M3 15h18M8 5v14M16 5v14"></path></svg>B-roll</div>
      </div>
    </main>

    <aside style="width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 10px">
        <button style="flex: 1; height: 56px; border-radius: 28px; border: none; background: rgba(253, 255, 252, 0.14); color: #fdfffc; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Prompt</button>
        <button style="flex: 1; height: 56px; border-radius: 28px; border: none; background: rgba(253, 255, 252, 0.14); color: #fdfffc; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V10M12 20V4M18 20v-7"></path></svg>Vote</button>
      </div>

      <section style="flex: 1; padding: 14px; border-radius: 18px; background: rgba(253, 255, 252, 0.1); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; justify-content: space-between"><h2 style="margin: 0; font-size: 18px">Comments</h2><button style="height: 30px; padding: 0 10px; border-radius: 15px; border: none; background: rgba(253, 255, 252, 0.14); color: #fdfffc; font-size: 14px">Hide</button></div>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; font-size: 15px; line-height: 1.3">
          <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
          <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
          <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
          <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
          <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
        </div>
      </section>

      <button style="height: 56px; border-radius: 28px; border: none; background: #ff9f1c; color: #011627; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4a5 5 0 0 0-4.6 6.9L4 17.3V20h2.7l6.4-6.4A5 5 0 0 0 20 9l-3 1-2-2 1-3z"></path></svg>Fix something</button>
      <button style="height: 56px; border-radius: 28px; border: none; background: #e71d36; color: #ffffff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>Press and hold to end</button>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
