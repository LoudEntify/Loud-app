<html lang="en">
<head>

</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'PT Sans Narrow','Arial Narrow',sans-serif;background:#011627}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
input::placeholder{color:#c9cfd1;opacity:1}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(80% 45% at 88% 8%, rgba(46, 196, 182, 0.38), rgba(46, 196, 182, 0) 65%), radial-gradient(75% 45% at 8% 52%, rgba(231, 29, 54, 0.26), rgba(231, 29, 54, 0) 65%), radial-gradient(95% 55% at 55% 100%, rgba(255, 159, 28, 0.24), rgba(255, 159, 28, 0) 62%), linear-gradient(125deg, rgba(253, 255, 252, 0) 30%, rgba(253, 255, 252, 0.07) 46%, rgba(253, 255, 252, 0) 58%), #011627; color: #fdfffc; font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif">
  <span style="position: absolute; top: 330px; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(253, 255, 252, 0.7)">[Artist A performing]</span>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 170px; background: linear-gradient(rgba(1, 22, 39, 0.75), rgba(1, 22, 39, 0))"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px; background: linear-gradient(rgba(1, 22, 39, 0), rgba(1, 22, 39, 0.9))"></div>

  <div style="position: absolute; left: 12px; right: 12px; top: 52px; display: flex; align-items: center; gap: 10px">
    <a href="Live.dc.html" aria-label="Leave show" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: rgba(1, 22, 39, 0.5); display: flex; align-items: center; justify-content: center"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Artist A] vs [Artist B]</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px"><span style="padding: 2px 8px; border-radius: 999px; background: #e71d36; color: #ffffff; font-size: 12px; font-weight: 700; letter-spacing: 0.1em">LIVE</span><span style="padding: 2px 8px; border-radius: 999px; background: #ff9f1c; color: #011627; font-size: 12px; font-weight: 700; letter-spacing: 0.1em">VERSUS</span>[n] watching</span>
    </div>
  </div>

  <div style="position: absolute; right: 12px; top: 112px; width: 104px; display: flex; flex-direction: column; gap: 6px">
    <div aria-label="[Artist B], waiting" style="height: 140px; border-radius: 14px; background: radial-gradient(90% 60% at 80% 10%, rgba(46, 196, 182, 0.45), rgba(46, 196, 182, 0) 65%), radial-gradient(90% 60% at 10% 90%, rgba(231, 29, 54, 0.32), rgba(231, 29, 54, 0) 65%), #0a2a40; border: 2px solid rgba(253, 255, 252, 0.45); box-sizing: border-box"></div>
    <span style="font-size: 14px; font-weight: 700; text-align: center">[Artist B]</span>
  </div>

  <span style="position: absolute; left: 16px; top: 120px; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(1, 22, 39, 0.65); font-size: 15px; font-weight: 700"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Now: [Artist A]</span>

  <section aria-label="Vote" style="position: absolute; left: 16px; bottom: 264px; width: 270px; box-sizing: border-box; padding: 14px; border-radius: 18px; background: rgba(1, 22, 39, 0.8); display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: #2ec4b6">VOTING IS OPEN</span>
    <span style="font-size: 19px; font-weight: 700; line-height: 1.2">Who moved you this round?</span>
    <div style="display: flex; gap: 8px">
      <button aria-pressed="true" style="flex: 1; height: 42px; border-radius: 21px; border: 2px solid #fdfffc; background: rgba(253, 255, 252, 0.16); color: #fdfffc; font-size: 16px; font-weight: 700">[Artist A]</button>
      <button aria-pressed="false" style="flex: 1; height: 42px; border-radius: 21px; border: none; background: rgba(253, 255, 252, 0.16); color: #fdfffc; font-size: 16px; font-weight: 700">[Artist B]</button>
    </div>
    <span style="font-size: 14px; color: rgba(253, 255, 252, 0.8)">One vote each. You can change it until voting closes.</span>
  </section>

  <div aria-label="Comments" style="position: absolute; left: 16px; bottom: 132px; width: 270px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.3">
    <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
    <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
    <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
  </div>

  <div style="position: absolute; right: 12px; bottom: 136px; display: flex; flex-direction: column; align-items: center; gap: 18px">
    <a href="SupportSheet.dc.html" aria-label="Support with tokens" style="width: 60px; color: #fdfffc; display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 52px; height: 52px; border-radius: 26px; background: #ff9f1c; color: #011627; display: flex; align-items: center; justify-content: center"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M14.5 9.5c-.4-.9-1.4-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.6 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.1 0-2.1-.6-2.5-1.5M12 6.5V8M12 16v1.5"></path></svg></span><span style="font-size: 13px; font-weight: 700">Support</span></a>
    <button aria-label="Share show" style="width: 60px; padding: 0; border: none; background: none; color: #fdfffc; display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(1, 22, 39, 0.5); display: flex; align-items: center; justify-content: center"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg></span><span style="font-size: 13px">Share</span></button>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 6px">
      <button aria-pressed="true" style="height: 32px; padding: 0 16px; border-radius: 16px; border: 2px solid #fdfffc; background: transparent; color: #fdfffc; font-size: 15px; font-weight: 700">Chat</button>
      <button aria-pressed="false" style="height: 32px; padding: 0 16px; border-radius: 16px; border: none; background: rgba(253, 255, 252, 0.14); color: #fdfffc; font-size: 15px; display: flex; align-items: center; gap: 6px"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"></path><path d="M9 9.5h.01M15 9.5h.01"></path></svg>Emoji</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <input aria-label="Write a comment" placeholder="Say something to both artists" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 18px; border: none; border-radius: 24px; background: rgba(253, 255, 252, 0.16); color: #fdfffc; font-size: 17px">
      <button aria-label="Send" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: none; background: linear-gradient(135deg, #2ec4b6 0%, #8fe6dd 48%, #2ec4b6 100%); color: #011627; display: flex; align-items: center; justify-content: center"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
