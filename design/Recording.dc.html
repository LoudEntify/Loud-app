<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recording</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'PT Sans Narrow','Arial Narrow',sans-serif;background:#011627}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
input::placeholder{color:#c9cfd1;opacity:1}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(80% 45% at 88% 8%, rgba(46, 196, 182, 0.38), rgba(46, 196, 182, 0) 65%), radial-gradient(75% 45% at 8% 52%, rgba(231, 29, 54, 0.26), rgba(231, 29, 54, 0) 65%), radial-gradient(95% 55% at 55% 100%, rgba(255, 159, 28, 0.24), rgba(255, 159, 28, 0) 62%), linear-gradient(125deg, rgba(253, 255, 252, 0) 30%, rgba(253, 255, 252, 0.07) 46%, rgba(253, 255, 252, 0) 58%), #011627; color: #fdfffc; font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif">
  <span style="position: absolute; top: 300px; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(253, 255, 252, 0.7)">[Recorded show]</span>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 440px; background: linear-gradient(rgba(1, 22, 39, 0), rgba(1, 22, 39, 0.9))"></div>

  <div style="position: absolute; left: 12px; right: 12px; top: 52px; display: flex; align-items: center; gap: 10px">
    <a href="Profile-Public.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: rgba(1, 22, 39, 0.5); display: flex; align-items: center; justify-content: center"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 19px; font-weight: 700">[Show title]</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px"><span style="padding: 2px 8px; border-radius: 999px; background: rgba(253, 255, 252, 0.18); font-size: 12px; font-weight: 700; letter-spacing: 0.1em">RECORDING</span>[Stage name] · [date]</span>
    </div>
    <button aria-label="Share recording" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: rgba(1, 22, 39, 0.5); color: #fdfffc; display: flex; align-items: center; justify-content: center"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg></button>
  </div>

  <button aria-label="Pause" style="position: absolute; left: 50%; top: 360px; transform: translateX(-50%); width: 72px; height: 72px; border-radius: 36px; border: none; background: rgba(1, 22, 39, 0.55); color: #fdfffc; display: flex; align-items: center; justify-content: center"><svg class="i" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><path d="M8 5v14M16 5v14"></path></svg></button>

  <div aria-label="Comments from the show" style="position: absolute; left: 16px; right: 16px; bottom: 150px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.3">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: rgba(253, 255, 252, 0.8)">COMMENTS FROM THE SHOW</span>
    <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
    <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
    <div><span style="font-weight: 700; color: #ff9f1c">[viewer]</span> [comment]</div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 96px; display: flex; flex-direction: column; gap: 6px">
    <div role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38" tabindex="0" style="position: relative; height: 6px; border-radius: 3px; background: rgba(253, 255, 252, 0.25)">
      <div style="width: 38%; height: 100%; border-radius: 3px; background: linear-gradient(135deg, #2ec4b6 0%, #8fe6dd 48%, #2ec4b6 100%)"></div>
      <span style="position: absolute; left: 38%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 8px; background: #fdfffc"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; color: rgba(253, 255, 252, 0.85)"><span>[mm:ss]</span><span>[mm:ss]</span></div>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 28px; display: flex; align-items: center; gap: 8px">
    <input aria-label="Write a comment" placeholder="Add a comment" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 18px; border: none; border-radius: 24px; background: rgba(253, 255, 252, 0.16); color: #fdfffc; font-size: 17px">
    <button aria-label="Send" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: none; background: linear-gradient(135deg, #2ec4b6 0%, #8fe6dd 48%, #2ec4b6 100%); color: #011627; display: flex; align-items: center; justify-content: center"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
