        <span style="width: 64px; height: 48px; flex-shrink: 0; border-radius: 8px; background: radial-gradient(90% 60% at 80% 10%, rgba(46, 196, 182, 0.45), rgba(46, 196, 182, 0) 65%), radial-gradient(90% 60% at 10% 90%, rgba(231, 29, 54, 0.32), rgba(231, 29, 54, 0) 65%), #0a2a40"></span>

        <button aria-label="Options for [Clip name]" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: none; color: #011627; display: flex; align-items: center; justify-content: center"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 0 12px; border-top: 1px solid rgba(1, 22, 39, 0.08)">
        <span style="width: 64px; height: 48px; flex-shrink: 0; border-radius: 8px; background: radial-gradient(90% 60% at 80% 10%, rgba(46, 196, 182, 0.45), rgba(46, 196, 182, 0) 65%), radial-gradient(90% 60% at 10% 90%, rgba(231, 29, 54, 0.32), rgba(231, 29, 54, 0) 65%), #0a2a40"></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">[Clip name]</span><span style="font-size: 14px; color: rgba(1, 22, 39, 0.75)">[mm:ss] · [n] MB</span></span>
