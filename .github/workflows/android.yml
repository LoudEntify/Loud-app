# android: build the Android app as an installable APK, from any branch.
#
# This started life as android-spike (spike/native-device-zoom only). The
# spike is now part of the app, Korey tests on real phones every few days,
# and a build that only exists on one branch is a build nobody can use. So:
# staging builds on every push, and any branch builds on demand
# (workflow_dispatch), which is how a device test gets an APK of exactly
# the code under test.
#
# The local Expo module in native/modules/loud-camera is Kotlin that only
# compiles against the real Android SDK and the LiveKit fork of
# react-native-webrtc, so neither `expo export` (ci.yml) nor Expo Go can
# catch an error in it. Here: prebuild the android/ project exactly as EAS
# does, compile the module first (fast, precise errors), then build the
# whole release APK.
#
# Nothing here needs a secret, an Expo account or a signing key: the Expo
# template signs release builds with the checked-in debug keystore. That
# keystore differs from EAS's, so a phone holding an EAS build must
# uninstall it before installing this one.
name: android

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
      # The same values native/eas.json bakes into the `preview` profile.
      # Without them the APK falls back to app.json's extra (API base
      # loudentify.app, no Supabase values): sign-in throws "Supabase is not
      # configured" and every API call goes to production. None of these
      # is a secret: the key is the staging project's publishable key.
      EXPO_PUBLIC_API_BASE: https://loud-app-git-staging-korey-alashe.vercel.app
      EXPO_PUBLIC_SUPABASE_URL: https://htepkxumrwtpbkahdric.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ocRnAxMgflUq-u4DtmRFSQ_2xQOtLec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The action's default package list is "tools platform-tools", and the
      # deprecated "tools" package no longer exists in cmdline-tools 16, so
      # the default fails with "Failed to find package 'tools'". The runner
      # image already carries the SDK; only platform-tools and the licence
      # acceptance are needed here, Gradle fetches the rest.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # native/src/shared.js imports lib/ from the web repo through a Metro
      # alias, so the release bundle (assembleRelease) needs the web
      # dependencies as well as the native ones.
      - run: npm ci
      - run: npm ci
        working-directory: native

      - name: Generate android/ (same as EAS)
        run: npx expo prebuild --platform android --no-install
        working-directory: native

      - name: Compile the loud-camera module
        run: ./gradlew :loud-camera:compileReleaseKotlin --no-daemon --stacktrace
        working-directory: native/android

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: native/android

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: loudentify-release-apk
          path: native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
