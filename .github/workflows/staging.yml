name: staging

# Runs on every push to `staging` (i.e. every PR merge, since ci.yml already
# gated the merge on `npm run check` passing). Applies migrations directly
# to the staging Supabase database.
#
# Deliberately no account-wide Supabase credential anywhere in this file.
# The original version used `supabase link` with a personal access token
# (SUPABASE_ACCESS_TOKEN) that can see every project in the account — a
# staging-only workflow should not hold a key that can reach production.
# Instead this connects straight to the one database it's allowed to touch,
# with `--db-url`, and a guard step refuses to run if that URL doesn't
# contain the staging project's own ref.
#
# No Vercel deploy step either — Vercel's Git integration deploys on push
# by itself, this workflow doesn't need to drive it. That also means no
# smoke test here: the old one needed VERCEL_TOKEN (to find the deploy URL)
# and VERCEL_AUTOMATION_BYPASS (to get past Vercel's own login on anything
# that isn't the production custom domain) — both secrets this workflow no
# longer holds, and there's no secret-free way to reach a protected preview
# URL. See docs/NEEDS_KOREY.md for what that leaves as a manual check.
#
# Secrets/variables used here exist ONLY in this repo's "staging" GitHub
# environment / as repository variables. See docs/NEEDS_KOREY.md for what
# each one is and how to create it.

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false # never cancel a migration mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard — refuse unless the DB URL is really the staging project
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          expected="${{ vars.STAGING_PROJECT_REF }}"
          if [ -z "$expected" ]; then
            echo "::error::Repository variable STAGING_PROJECT_REF is not set. Refusing to apply migrations without knowing which project to expect — see docs/NEEDS_KOREY.md."
            exit 1
          fi
          case "$SUPABASE_STAGING_DB_URL" in
            *"$expected"*) echo "DB URL contains the expected staging project ref ($expected). Continuing." ;;
            *) echo "::error::SUPABASE_STAGING_DB_URL does not contain the expected staging project ref ($expected). This URL may point at the wrong project — refusing to apply migrations." ; exit 1 ;;
          esac

      - name: Apply migrations to staging
        working-directory: supabase
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_STAGING_DB_URL" --yes

      - name: Verify migrations landed
        working-directory: supabase
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_STAGING_DB_URL"
