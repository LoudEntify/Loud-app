name: promote

# Manual only. Korey runs this from the Actions tab when staging has been
# tested and approved. It merges staging into main and applies the same
# migration files to the production Supabase database.
#
# Two separate gates, deliberately not combined into one:
#
#   1. `check-protected-paths` runs immediately, no human needed, and fails
#      the whole run if any protected-path change (money, identity, RLS,
#      the audit log — see docs/CLAUDE.md §2) is still waiting on a
#      recorded human approval in docs/NEEDS_KOREY.md. This is the content
#      check CLAUDE.md requires: "the promote workflow must check for the
#      approval and refuse if it is missing."
#   2. `promote` depends on it and runs under the `production` GitHub
#      Environment, which is where the actual manual-approval click lives
#      (configured in repo settings as a required reviewer on that
#      environment — see docs/NEEDS_KOREY.md). If gate 1 were inside the
#      gated job, the reviewer would be asked to approve before the
#      protected-path check had even run.
#
# No account-wide Supabase credential here either — same reasoning as
# staging.yml: connects straight to the one database it's allowed to
# touch with `--db-url`, guarded by the production project's own ref, never
# a personal access token that can see every project in the account.
#
# No Vercel deploy step: Vercel's Git integration deploys `main` on push by
# itself once this workflow pushes the merge. No smoke test either — the
# production smoke test would need PRODUCTION_SMOKE_EMAIL/PASSWORD, which
# are secrets, and this workflow only keeps checks that need none. See
# docs/NEEDS_KOREY.md for what that leaves as a manual check.
#
# Production credentials exist only as secrets on the `production`
# environment and are never used anywhere else in this repo.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-protected-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse if a protected-path change is unapproved
        run: |
          if grep -qE '^- \[ \]' docs/NEEDS_KOREY.md && \
             awk '/## Reviews needed before promotion/,0' docs/NEEDS_KOREY.md | grep -qE '^- \[ \]'; then
            echo "::error::An item under 'Reviews needed before promotion' in docs/NEEDS_KOREY.md is still unchecked. Get Ugo or Korey's approval, tick it, commit, then re-run promote."
            exit 1
          fi
          echo "No outstanding protected-path approvals. Continuing."

  promote:
    needs: check-protected-paths
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Merge staging into main (fast-forward only)
        run: |
          git config user.name "loudentify-promote-bot"
          git config user.email "noreply@loudentify.invalid"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/staging
          git push origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard — refuse unless the DB URL is really the production project
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: |
          expected="${{ vars.PRODUCTION_PROJECT_REF }}"
          if [ -z "$expected" ]; then
            echo "::error::Repository variable PRODUCTION_PROJECT_REF is not set. Refusing to apply migrations without knowing which project to expect — see docs/NEEDS_KOREY.md."
            exit 1
          fi
          case "$SUPABASE_PRODUCTION_DB_URL" in
            *"$expected"*) echo "DB URL contains the expected production project ref ($expected). Continuing." ;;
            *) echo "::error::SUPABASE_PRODUCTION_DB_URL does not contain the expected production project ref ($expected). This URL may point at the wrong project — refusing to apply migrations." ; exit 1 ;;
          esac

      - name: Apply the same migration files to production
        working-directory: supabase
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_PRODUCTION_DB_URL" --yes

      - name: Verify migrations landed
        working-directory: supabase
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_PRODUCTION_DB_URL"
