name: ci

# Runs on every push and every pull request. No secrets are used here —
# everything below runs against a throwaway Postgres started by the job
# itself and against a build that touches no Supabase/LiveKit env vars.
#
# Order matters and is deliberate:
#   1. migrations  — apply supabase/migrations from scratch to an empty
#                    Postgres 16 (scripts/db/apply-migrations.sh, with the
#                    scripts/db/supabase-stub.sql stand-in for a Supabase
#                    project), then run supabase/tests/*.sql (permission,
#                    ledger and audit tests). A migration that only works on
#                    a database that already has yesterday's state fails
#                    here, before it can fail on staging.
#   2. lint/tests  — the check:* scripts (eslint rules called directly with
#                    --no-eslintrc; `next lint` would open an interactive
#                    prompt and hang) and the node test files.
#   3. build       — `next build`, with missing-import warnings treated as
#                    errors (check:build).
#   4. native      — the Expo app in native/ (separate job, no secrets):
#                    `npm ci` from its own lockfile, the Expo dependency
#                    check (scripts/native-expo-drift.mjs: `expo install
#                    --check --json`, where a PATCH-level drift such as
#                    57.0.27 vs ~57.0.28 is a warning annotation and a
#                    major/minor mismatch, an unreadable version or a check
#                    that cannot run fails), `expo-doctor`, then `expo
#                    export` for iOS and Android, which compiles the real JS
#                    bundles through Metro. A broken import, config plugin
#                    or lockfile fails here instead of on Korey's phone; a
#                    routine Expo patch release published overnight does not
#                    (docs/DECISIONS.md 2026-10-14).

on:
  push:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/loudentify_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply every migration from scratch
        run: scripts/db/apply-migrations.sh --fresh

      - name: Run SQL tests (permissions, ledger, audit)
        run: scripts/db/run-sql-tests.sh

      - run: npm ci

      - name: Lint and unit tests
        run: npm run check:lint && npm run test

      - name: Build
        run: npm run check:build

  e2e:
    # The viewer experience in a real browser against the real migrations:
    # scripts/dev/e2e.sh (throwaway database, PostgREST + a fake GoTrue,
    # `next start`, Playwright). No secrets.
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/loudentify_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the logs if it failed
        if: failure()
        run: for f in /tmp/e2e-*.log; do echo "=== $f"; tail -60 "$f"; done

  native:
    # The Expo app. Nothing here needs a device, an Expo account or a secret.
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json
      # native/src/shared.js imports lib/ from the web repo through a Metro
      # alias, so the web dependencies must exist for the bundle to compile.
      - run: npm ci
      - run: npm ci
        working-directory: native
      - name: Expo dependencies (patch drift warns, anything else fails)
        run: node scripts/native-expo-drift.mjs native
      # expo-doctor repeats the dependency-version check and fails on a patch
      # mismatch (today's Expo patches turned every branch red again); the
      # drift step above already runs that check with the right severity,
      # so doctor keeps its other 20 checks and skips this one.
      - name: Expo doctor
        run: npx expo-doctor
        working-directory: native
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: 1
      - name: Compile the iOS and Android bundles
        run: npx expo export --platform ios --platform android --output-dir /tmp/expo-export
        working-directory: native
