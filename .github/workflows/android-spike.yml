# android-spike: compile the Android app on this branch without an EAS build.
#
# Only for spike/native-device-zoom. The local Expo module in
# native/modules/loud-camera is Kotlin that only compiles against the real
# Android SDK and the LiveKit fork of react-native-webrtc, so neither
# `expo export` (ci.yml) nor Expo Go can catch an error in it. Before this
# workflow every compile error cost one EAS build. Here: prebuild the
# android/ project exactly as EAS does, compile the module first (fast,
# precise errors), then build the whole release APK.
#
# Nothing here needs a secret, an Expo account or a signing key: the
# Expo template signs release builds with the checked-in debug keystore.
name: android-spike

on:
  push:
    branches: [spike/native-device-zoom]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # native/src/shared.js imports lib/ from the web repo through a Metro
      # alias, so the release bundle (assembleRelease) needs the web
      # dependencies as well as the native ones.
      - run: npm ci
      - run: npm ci
        working-directory: native

      - name: Generate android/ (same as EAS)
        run: npx expo prebuild --platform android --no-install
        working-directory: native

      - name: Compile the loud-camera module
        run: ./gradlew :loud-camera:compileReleaseKotlin --no-daemon --stacktrace
        working-directory: native/android

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: native/android

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: loudentify-release-apk
          path: native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
