// native/modules/loud-camera — local Expo module for the device-zoom spike.
// Compiled by EAS (dev build) and, on this branch only, by the
// android-spike workflow (.github/workflows/android-spike.yml), which is
// how a Kotlin error is caught without spending an EAS build. CameraX is
// pinned to the version expo-camera already pulls in so the app never
// carries two copies.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.loudentify'
version = '0.1.0'

android {
  namespace "app.loudentify.loudcamera"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // React Native's bridge classes (ReactContext, Callback, WritableMap):
  // the expo-module-gradle-plugin puts expo-modules-core on the classpath
  // but react-android only as that module's own implementation
  // dependency, so a module that talks to WebRTCModule has to name it.
  // Version-less on purpose: the React Native Gradle plugin pins it to
  // the installed react-native for every project in the build, the same
  // way expo-modules-core declares it.
  implementation "com.facebook.react:react-android"

  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.lifecycle:lifecycle-runtime:2.8.7"
  // The LiveKit fork of react-native-webrtc: its WebRTCModule is where a
  // custom capturer becomes a local track the JS side can publish.
  implementation project(':livekit_react-native-webrtc')
}
