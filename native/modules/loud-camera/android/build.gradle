// native/modules/loud-camera — the local Expo module: the camera
// capturer, the vocal chain, the input meter and the backing track.
// Compiled by EAS (dev build) and by the `android` workflow
// (.github/workflows/android.yml), which is how a Kotlin error is caught
// without spending an EAS build — on pull requests as well as on staging
// since 8 November, for the reason in the LiveKit dependency below.
// CameraX is
// pinned to the version expo-camera already pulls in so the app never
// carries two copies.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.loudentify'
version = '0.1.0'

android {
  namespace "app.loudentify.loudcamera"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // React Native's bridge classes (ReactContext, Callback, WritableMap):
  // the expo-module-gradle-plugin puts expo-modules-core on the classpath
  // but react-android only as that module's own implementation
  // dependency, so a module that talks to WebRTCModule has to name it.
  // Version-less on purpose: the React Native Gradle plugin pins it to
  // the installed react-native for every project in the build, the same
  // way expo-modules-core declares it.
  implementation "com.facebook.react:react-android"

  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.lifecycle:lifecycle-runtime:2.8.7"
  // The LiveKit fork of react-native-webrtc: its WebRTCModule is where a
  // custom capturer becomes a local track the JS side can publish.
  implementation project(':livekit_react-native-webrtc')
  // @livekit/react-native, which is a DIFFERENT Gradle project from the
  // webrtc fork above and the one that owns the audio classes:
  // com.livekit.reactnative.LiveKitReactNative (whose
  // audioProcessingController is where a capture post-processor is
  // installed) and com.livekit.reactnative.audio.processing.
  // AudioProcessorInterface (which LoudVocalChain implements).
  //
  // Missing since the vocal chain was written on 6 November, which took
  // the APK build red and kept it red for five commits: ci.yml does not
  // compile Kotlin — `expo export` only bundles JS — so the only job
  // that would have caught this is .github/workflows/android.yml, and
  // that one does not run on pull requests. Both halves are fixed here.
  implementation project(':livekit_react-native')
}
